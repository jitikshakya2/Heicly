<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0d10">
  <meta name="robots" content="noindex, follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Page Not Found | Heicly</title>
  <meta name="description" content="The page you requested could not be found. Return to Heicly's free browser-based HEIC converter.">
  <link rel="icon" type="image/png" sizes="1024x1024" href="heicly-logo-concept-b.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0d10;
      --bg-card: #16181d;
      --border: #24272e;
      --accent: #ff5a4e;
      --accent-dark: #d8483e;
      --text-main: #f2f3f5;
      --text-muted: #9a9ea8;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }
    main {
      width: min(100%, 620px);
      padding: 48px 32px;
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, var(--accent), #ff8a4e);
      color: #14100e;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(255, 90, 78, 0.18);
    }
    .code {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: clamp(52px, 12vw, 88px);
      line-height: 1;
      letter-spacing: -0.05em;
    }
    h1 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-size: clamp(24px, 5vw, 34px);
      letter-spacing: -0.03em;
    }
    p {
      max-width: 470px;
      margin: 0 auto 28px;
      color: var(--text-muted);
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 10px;
      background: var(--accent);
      color: #14100e;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    a.button:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }
    a.button:focus-visible {
      outline: 3px solid rgba(255, 90, 78, 0.45);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="mark" aria-hidden="true">H</div>
    <p class="code" aria-hidden="true">404</p>
    <h1 id="page-title">Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Head back to Heicly and convert your HEIC images directly in your browser.</p>
    <a class="button" href="/" aria-label="Return to Heicly home page">Return to Heicly</a>
  </main>
</body>
</html>
