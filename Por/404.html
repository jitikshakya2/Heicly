  <style>
    :root {
      --bg: #111317;
      --bg-card: rgba(20, 25, 22, 0.7);
      --border: rgba(0, 255, 102, 0.2);
      --accent: #00ff66;
      --accent-dark: #00cc52;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }
    main {
      width: min(100%, 620px);
      padding: 48px 32px;
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, var(--accent), #ff8a4e);
      color: #14100e;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(255, 90, 78, 0.18);
    }
    .code {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: clamp(52px, 12vw, 88px);
      line-height: 1;
      letter-spacing: -0.05em;
    }
    h1 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-size: clamp(24px, 5vw, 34px);
      letter-spacing: -0.03em;
    }
    p {
      max-width: 470px;
      margin: 0 auto 28px;
      color: var(--text-muted);
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 10px;
      background: var(--accent);
      color: #14100e;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    a.button:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }
    a.button:focus-visible {
      outline: 3px solid rgba(255, 90, 78, 0.45);
      outline-offset: 3px;
    }
  
  @media (max-width: 720px) {
    header.nav {
        padding: 14px 16px !important;
    }
    .nav-right-group {
        gap: 8px !important;
    }
    .css-lang-container .nav-menu-panel {
        position: absolute !important;
        top: calc(100% + 8px) !important;
        left: auto !important;
        right: 0 !important;
        width: max-content !important;
        padding: 4px !important;
        border: 1px solid rgba(0, 255, 102, 0.3) !important;
    }
    .css-lang-container .nav-menu-item {
        padding: 6px 12px !important;
    }
    
    .footer-inner {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 32px !important;
    }
    .footer-links {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        width: 100% !important;
        gap: 16px 24px !important;
    }

    h1.hero-title {
        font-size: clamp(28px, 8vw, 40px) !important;
    }
    .hero {
        padding: 60px 16px 30px !important;
    }
  }


  html {
      overflow-x: hidden !important;
      width: 100%;
  }
  body {
      overflow-x: hidden !important;
      width: 100%;
  }
  canvas {
      max-width: 100vw;
  }
  @media (max-width: 480px) {
      .controls {
          flex-direction: column;
          gap: 12px;
          width: 100%;
      }
      .controls .btn {
          width: 100%;
          box-sizing: border-box;
      }
      .nav-menu-trigger span {
          /* Optionally hide the text "Tools" and "EN" on tiny screens to save space, just show icons */
          /* But the user wants them identical, so let's just reduce padding */
      }
      .nav-menu-trigger {
          padding: 6px 10px !important;
          font-size: 13px !important;
      }
      .brand {
          font-size: 16px !important;
          gap: 8px !important;
      }
      .brand svg {
          width: 32px !important;
          height: 32px !important;
      }
  }

</style>
</head>

<style class="quantum-patch">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

body { 
    font-family: 'Inter', sans-serif !important; 
    background: transparent !important;
}
html {
    background: #111317;
}
h1, h2, h3, h4, h5, h6, .brand, .nav-menu-item-title {
    font-family: 'Space Grotesk', sans-serif !important;
    text-transform: none !important;
}

/* Glassmorphism over the network */
  .nav-menu-panel, .lang-menu-panel {
      backdrop-filter: blur(28px) !important;
      -webkit-backdrop-filter: blur(28px) !important;
      background: rgba(10, 13, 15, 0.92) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6) !important;
      transition: all 0.3s ease !important;
      border: 1px solid rgba(0, 255, 102, 0.3) !important;
  }
  
  .nav-menu-trigger, .lang-menu-trigger, 
  .dropzone, .state-panel, .format-card, .info-card, .stat, .result-card, .btn-secondary, .card {
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border-radius: var(--radius-lg) !important;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3) !important;
    transition: all 0.3s ease !important;
}

.btn-primary, .btn-secondary, .nav-menu-trigger, .lang-menu-trigger, .lang-menu-item, .nav-menu-item {
    text-transform: none !important;
    border-radius: var(--radius-lg) !important;
}

.btn-primary:hover, .btn-secondary:hover, .nav-menu-trigger:hover, .lang-menu-trigger:hover, .lang-menu-item:hover, .nav-menu-item:hover {
    transform: translateY(-2px) !important;
}
</style>

<canvas id="particle-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>
<script>
// --- Quantum Network Node Background ---
const canvas = document.getElementById('particle-canvas');
if (canvas) {
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let nodes = [];
    const maxNodes = window.innerWidth < 768 ? 60 : 150;
    const connectionDistance = 140;
    
    let mouse = { x: canvas.width/2, y: canvas.height/2, radius: 200, isHovering: false };

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });
    
    document.addEventListener('mouseover', (e) => {
        if(e.target.closest('.dropzone') || e.target.closest('.card')) {
            mouse.isHovering = true;
        } else {
            mouse.isHovering = false;
        }
    });

    class Node {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = (Math.random() - 0.5) * 1.5;
            this.radius = Math.random() * 2 + 1;
            this.color = Math.random() > 0.8 ? '#00ff66' : '#ffffff';
        }
        update() {
            if(mouse.isHovering) {
                let dx = (canvas.width/2) - this.x;
                let dy = (canvas.height/2) - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist > 0) {
                    this.vx += (dx / dist) * 0.08;
                    this.vy += (dy / dist) * 0.08;
                }
                let speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                if(speed > 5) {
                    this.vx = (this.vx / speed) * 5;
                    this.vy = (this.vy / speed) * 5;
                }
            } else {
                let speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                if(speed > 1.5) {
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                }
            }
        
            this.x += this.vx;
            this.y += this.vy;

            if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
            
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx*dx + dy*dy);
            if(distance < mouse.radius && !mouse.isHovering) {
                this.x -= dx * 0.02;
                this.y -= dy * 0.02;
            }

            this.draw();
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    for(let i=0; i<maxNodes; i++) {
        nodes.push(new Node());
    }

    function animateNetwork() {
        ctx.fillStyle = '#111317';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        for(let a=0; a<nodes.length; a++) {
            for(let b=a+1; b<nodes.length; b++) {
                let dx = nodes[a].x - nodes[b].x;
                let dy = nodes[a].y - nodes[b].y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                
                if(distance < connectionDistance) {
                    ctx.beginPath();
                    ctx.moveTo(nodes[a].x, nodes[a].y);
                    ctx.lineTo(nodes[b].x, nodes[b].y);
                    let opacity = 1 - (distance/connectionDistance);
                    ctx.strokeStyle = nodes[a].color === '#00ff66' || nodes[b].color === '#00ff66' ? 
                                      `rgba(0, 255, 102, ${opacity * 0.5})` : 
                                      `rgba(255, 255, 255, ${opacity * 0.2})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
            
            if(!mouse.isHovering) {
                let mdx = nodes[a].x - mouse.x;
                let mdy = nodes[a].y - mouse.y;
                let mDist = Math.sqrt(mdx*mdx + mdy*mdy);
                if(mDist < connectionDistance) {
                    ctx.beginPath();
                    ctx.moveTo(nodes[a].x, nodes[a].y);
                    ctx.lineTo(mouse.x, mouse.y);
                    let mOp = 1 - (mDist/connectionDistance);
                    ctx.strokeStyle = `rgba(0, 255, 102, ${mOp * 0.6})`;
                    ctx.stroke();
                }
            }
        }

        for(let i=0; i<nodes.length; i++) {
            nodes[i].update();
        }

        requestAnimationFrame(animateNetwork);
    }
    animateNetwork();
}
</script>
